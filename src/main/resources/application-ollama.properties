# =====================================================================
# ollama 프로필 — API 키 없이 내 PC 에서 LLM 을 돌린다
#   실행: mvnw spring-boot:run -Dspring-boot.run.profiles=dev,ollama
#
# 사전 준비 (최초 1회)
#   1. https://ollama.com/download 에서 Ollama 설치
#   2. 설치하면 localhost:11434 에 데몬이 뜬다. 모델은 아래 init 설정이
#      기동 시 자동으로 받으므로 따로 pull 하지 않아도 된다.
#
# 검색은 별도의 로컬 KLUE-BERT 인코더를 사용한다.
# =====================================================================

spring.ai.model.chat=ollama

spring.ai.ollama.base-url=http://localhost:11434

# 기본값은 exaone3.5:2.4b (1.6GB) — LG AI Research 의 한/영 이중언어 모델이다.
# 한국어 정책 도메인이고 이 PC 는 CPU 추론이라, 작고 한국어에 강한 쪽을 골랐다.
# 지시 따르기가 더 필요하면 qwen3:4b-instruct (2.5GB) 로 바꾼다.
#   (qwen3:4b 는 thinking 모드가 기본이라 CPU 에서 느리고 <think> 블록이 섞인다 — instruct 태그를 쓸 것)
# 환경변수로 덮어쓸 수 있다:  $env:OLLAMA_CHAT_MODEL = "qwen3:4b-instruct"
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:exaone3.5:2.4b}

# 모델이 없으면 기동 시 자동으로 내려받는다. 최초 1회는 다운로드 때문에 오래 걸린다.
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.chat.include=true
spring.ai.ollama.init.timeout=20m
spring.ai.ollama.init.max-retries=1

# 근거 자료 밖으로 새어 나가지 않게 낮게 잡는다.
# (Claude Opus 5 와 달리 Ollama 는 temperature 를 정상적으로 받는다)
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-predict=1024
