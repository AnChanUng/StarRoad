# =====================================================================
# gemini 프로필 — Google AI Studio 무료 키로 생성 모델을 쓴다
#   실행: mvnw spring-boot:run -Dspring-boot.run.profiles=dev,gemini
#
# 사전 준비 (최초 1회)
#   1. https://aistudio.google.com/app/apikey 에서 키 발급 (결제수단 등록 없음)
#   2. 환경변수 설정
#        PowerShell : $env:GEMINI_API_KEY = "..."
#
# 무료 티어라 분당 요청 수 제한이 있다. 발표·시연 정도에는 충분하다.
# 검색은 별도의 로컬 KLUE-BERT 인코더를 사용한다.
# =====================================================================

spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# 근거 자료 밖으로 새어 나가지 않게 낮게 잡는다.
spring.ai.google.genai.chat.options.temperature=0.1
