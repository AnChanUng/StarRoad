# DATABASE
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.username=c##starroad
spring.datasource.password=srsr
#jpa
# Hibernate 6 는 접속한 Oracle 버전을 감지해 dialect 를 고른다 (고정 시 구버전 SQL 생성)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# jsp
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/resources/**
spring.web.resources.static-locations=/resources/
# Swagger
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# ddl-auto
spring.jpa.hibernate.ddl-auto=update

# ===== AI 챗봇 (Spring AI) =====
# 생성 모델 스위치. 스타터를 여러 개 넣어 두었기 때문에 반드시 명시해야 한다 —
# 비워 두면 자동설정이 전부 활성화돼 ChatModel 빈이 여러 개 생기고 주입이 깨진다.
#   anthropic   : Claude (유료 키 필요)              — 기본
#   ollama      : 로컬 LLM (키 불필요)               — -Dspring-boot.run.profiles=dev,ollama
#   google-genai: Gemini (AI Studio 무료 키)         — -Dspring-boot.run.profiles=dev,gemini
spring.ai.model.chat=anthropic
# 임베딩도 같은 이유로 고정한다. ollama 스타터의 임베딩 자동설정과 충돌하는 걸 막는다.
spring.ai.model.embedding=transformers
# 생성 모델: Anthropic Claude. 키는 환경변수 ANTHROPIC_API_KEY 로 주입한다(소스에 넣지 말 것).
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-opus-5
spring.ai.anthropic.chat.options.max-tokens=1024

# 임베딩 모델: JVM 내장 ONNX. 외부 서버도 API 키도 필요 없다.
# multilingual-e5-small (384차원, 한국어 포함 다국어) — 최초 1회 다운로드 후 캐시된다.
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/tokenizer.json
spring.ai.embedding.transformer.cache.directory=./.embedding-model

# ===== RAG 튜닝 =====
# 검색해 올 문서 수
starroad.rag.top-k=4
# 유사도 하한. 이 값 미만이면 LLM 을 호출하지 않고 "답변 불가"로 처리한다(환각 차단 L1).
# RagRetrievalEvalTest 실측(임계값을 정할 당시: dev 샘플 10건, 평가셋 중 검색 평가 대상 25문항):
#   정답 자료 최저점 0.8727 / 무관 질문 최고점 0.8242("오늘 서울 날씨 어때?")
#   예전 값 0.83 은 무관 질문과 0.006 차이밖에 안 나서 중간값 0.85 로 올렸다(양쪽 여유 약 0.02).
#   변경 전후 기록: src/test/resources/eval/retrieval-baseline.json, docs/PORTFOLIO.md
# 데이터가 바뀌면 RagRetrievalEvalTest 를 다시 돌려 재조정할 것.
starroad.rag.similarity-threshold=0.85
# 정책 공고문 원문을 나누는 크기(글자 수)와 이웃 청크가 겹치는 글자 수. chunk-size=0 이면 나누지 않는다.
# RagChunkingEvalTest 실측(공고문 6건, 공고문 질문 18문항, 크기 7종 x 겹침 3종):
#   나누지 않음  : 근거 유사도 평균 0.8935 / 최저 0.8665, 프롬프트에 주입되는 자료 평균 3,205자
#   200자·겹침 50 : 근거 유사도 평균 0.9021 / 최저 0.8829, 주입 자료 평균 873자, 근거 포함 18/18
#   겹침 0 은 150자·200자에서 근거 포함이 17/18 로 떨어졌고, 600자 이상은 유사도가 다시 내려갔다.
# 값을 바꾸면 색인을 다시 만들어야 한다(POST /starroad/chat/reindex 또는 색인 파일 삭제).
starroad.rag.chunk-size=200
starroad.rag.chunk-overlap=50
# 정책 공고문 원문 위치(예: file:/data/notices/*.txt). 비워 두면 DB row 요약 문서만 색인한다.
starroad.rag.notice-location=
# 색인 저장 위치. 삭제하면 다음 기동 때 DB 에서 다시 만든다.
starroad.rag.index-file=./rag-index.json

# ===== 가드레일 (GuardrailAdvisor) =====
# 금지 문구·개인정보 패턴·프롬프트 유출 표식 목록은 Ai/GuardrailRules.java 에 있다.
# (application.properties 는 ISO-8859-1 로 읽혀 한글 값을 넣으면 깨지므로 코드에 둔다)
# 질문 최대 길이. 이보다 길면 LLM 에 보내지 않는다 — 비용·프롬프트 주입 방어.
starroad.guardrail.max-question-length=500

# ===== 관측성 (Spring Boot Actuator) =====
# /actuator/metrics/starroad.chat.requests       전체 요청 수 (tag outcome=answered|not_found|blocked|error)
# /actuator/metrics/starroad.guardrail.blocked   차단 횟수   (tag stage=input|output, rule=...)
# /actuator/metrics/starroad.chat.latency        응답 시간
# /actuator/metrics/gen_ai.client.token.usage    토큰 사용량 (Spring AI 가 자동 기록)
# 운영에 올릴 때는 SecurityConfig 에서 /actuator/** 접근을 막을 것.
management.endpoints.web.exposure.include=health,info,metrics
