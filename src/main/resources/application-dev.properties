# =====================================================================
# dev 프로필 — Oracle 없이 로컬에서 앱을 띄우기 위한 설정
#   실행: mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# 인메모리 DB 라 종료하면 데이터가 사라지고, 기동할 때마다 DevDataSeeder 가
# 샘플 정책·상품을 다시 넣는다. 운영 설정(application.properties)은 그대로 둔다.
# =====================================================================

# MODE=Oracle 로 둬야 Product 의 @Formula 안에 있는 Oracle 함수 nvl() 이 동작한다.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:starroad;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# 기동할 때마다 스키마를 새로 만든다
spring.jpa.hibernate.ddl-auto=create-drop
# Policy.explain 처럼 예약어와 겹치는 컬럼명을 Hibernate 가 자동으로 따옴표 처리하게 한다
spring.jpa.properties.hibernate.auto_quote_keyword=true

# http://localhost:8080/h2-console 에서 DB 를 직접 들여다볼 수 있다
# (JDBC URL 은 위 spring.datasource.url 을 그대로 입력)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 인메모리 DB 는 매 기동마다 내용이 바뀌므로 색인을 항상 새로 만든다
starroad.rag.always-reindex=true
starroad.rag.index-file=./rag-index-dev.json
# 샘플 정책 공고문 원문(6건). 청크로 나눠 색인한다. 운영에서는 file:/경로/*.txt 로 바꾼다.
starroad.rag.notice-location=classpath:rag/notices/*.txt
